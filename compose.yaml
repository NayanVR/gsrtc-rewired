services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gsrtc_rewired
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: build
    command: ["bun", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"

  app:
    build:
      context: .
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_PAYMENTS_WEBHOOK_KEY: ${DODO_PAYMENTS_WEBHOOK_KEY:-}
      DODO_PRODUCT_ID_BOOKING: ${DODO_PRODUCT_ID_BOOKING:-}
      DODO_PRODUCT_ID_WALLET: ${DODO_PRODUCT_ID_WALLET:-}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      PORT: "3000"
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres_data:
